name: Weekly TxDOT Estimate Audit

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  audit-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run TxDOT Estimate Verification & Audit
        run: |
          python backend/verify_txdot_estimates.py

      - name: Upload Audit Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: estimate-audit-report
          path: backend/estimate_audit_report_*.csv
