<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapeSnap Express - Google Satellite Map Site Measuring Tape</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Google/Esri High-Res Satellite Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="express-app">
    
    <!-- Top Site Bar -->
    <header class="express-header">
      <div class="site-input-group">
        <label for="siteNameInput"><i class="fa-solid fa-location-dot"></i> SITE:</label>
        <input type="text" id="siteNameInput" value="Site AX" placeholder="Site Name...">
      </div>
      
      <div class="header-right">
        <button id="btnVoiceToggle" class="btn-icon-toggle active" title="Voice Readout ON/OFF">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button id="btnUnitToggle" class="unit-pill" title="Toggle Unit">RFT (Feet)</button>
      </div>
    </header>

    <!-- SATELLITE MAP WINDOW (Google / Esri Satellite Distance Measurement Technique) -->
    <section class="map-window-container">
      <div id="satelliteMap" class="satellite-map-stage"></div>
      
      <!-- Live Map Status Overlay Badge -->
      <div class="map-status-badge">
        <span class="badge-dot"></span>
        <span id="mapStatusText">TAP SATELLITE MAP TO DROP POINT A</span>
      </div>

      <!-- Quick Map Action Controls -->
      <div class="map-quick-controls">
        <button id="btnLocateMe" class="map-ctrl-btn" title="Locate My Current GPS Position">
          <i class="fa-solid fa-crosshairs"></i> My Location
        </button>
        <button id="btnClearMapPins" class="map-ctrl-btn btn-danger-soft" title="Clear Map Pins">
          <i class="fa-solid fa-arrow-rotate-left"></i> Reset Pins
        </button>
      </div>
    </section>

    <!-- Main Measuring Stage -->
    <main class="express-main">
      
      <!-- Current Live Segment Display -->
      <div class="live-readout-card">
        <span class="readout-label" id="readoutLabel">POINT A ➔ POINT B</span>
        <div class="readout-number" id="readoutVal">0.0 <span class="readout-unit">RFT</span></div>
      </div>

      <!-- Quick Voice Mic & Distance Input Bar -->
      <div class="quick-input-bar">
        <button id="btnVoiceMic" class="btn-voice-mic" title="Speak Distance Out Loud">
          <i class="fa-solid fa-microphone"></i>
          <span>SPEAK DISTANCE</span>
        </button>

        <button id="btnManualInput" class="btn-manual-key" title="Enter Number Manually">
          <i class="fa-solid fa-keyboard"></i>
          <span>ENTER NUMBER</span>
        </button>
      </div>

      <!-- Measurements Tally Ledger (Excel Notepad Preview) -->
      <div class="ledger-container">
        <div class="ledger-header">
          <h3><i class="fa-solid fa-list-ol"></i> Site Log (<span id="logCount">0</span>)</h3>
          <div class="ledger-total">TOTAL: <strong id="totalTallyVal">0.0 RFT</strong></div>
        </div>
        
        <div id="ledgerList" class="ledger-list">
          <div class="empty-ledger">
            <i class="fa-solid fa-map-location-dot"></i>
            <p>No measurements taken yet.</p>
            <span>Tap satellite map to drop Point A & Point B, or speak distance to log into Excel!</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Office Export Bar -->
    <footer class="express-footer">
      <button id="btnExportNotepad" class="btn-export btn-notepad">
        <i class="fa-solid fa-copy"></i>
        <span>Copy for Notepad / WhatsApp</span>
      </button>
      
      <button id="btnExportExcel" class="btn-export btn-excel">
        <i class="fa-solid fa-file-excel"></i>
        <span>Save Excel Sheet (.CSV)</span>
      </button>
    </footer>

  </div>

  <!-- Leaflet JS for Satellite Map Measurement -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- App JavaScript Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
