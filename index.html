<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Digital Tape Measure</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 24px 16px;
      z-index: 10;
    }
    .status-card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      max-width: 90%;
    }
    .readout-card {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #00e5ff;
      border-radius: 16px;
      padding: 16px 28px;
      text-align: center;
      color: #fff;
      display: none;
      box-shadow: 0 8px 32px rgba(0, 229, 255, 0.2);
    }
    .readout-val {
      font-size: 2rem;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 0.5px;
    }
    .readout-sub {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 4px;
    }
    .action-controls {
      display: flex;
      gap: 12px;
      pointer-events: auto;
      margin-bottom: 12px;
    }
    button {
      background: #00e5ff;
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.4);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: none;
    }
  </style>

  <!-- Import Three.js & WebXR Polyfills -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="status-card" id="instruction">Point camera at floor or wall to detect surface</div>
    
    <div class="readout-card" id="readoutCard">
      <div class="readout-val" id="distanceReadout">0' 0"</div>
      <div class="readout-sub" id="metricReadout">0.00 m</div>
    </div>

    <div class="action-controls">
      <button id="resetBtn" class="secondary" style="display:none;" onclick="resetMeasurement()">Clear</button>
      <button id="arBtn">Enter AR Measure</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let xrRefSpace = null;

    let reticle;
    let points = [];
    let measurementLine = null;

    const instruction = document.getElementById('instruction');
    const readoutCard = document.getElementById('readoutCard');
    const distanceReadout = document.getElementById('distanceReadout');
    const metricReadout = document.getElementById('metricReadout');
    const resetBtn = document.getElementById('resetBtn');
    const arBtn = document.getElementById('arBtn');

    init();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Create Ring Reticle to show locked surface plane
      const ringGeo = new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Check WebXR AR Support
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            arBtn.addEventListener('click', startAR);
          } else {
            arBtn.innerText = "WebXR Not Supported";
            instruction.innerText = "AR requires Android Chrome (ARCore) or WebXR Viewer on iOS";
          }
        });
      } else {
        arBtn.innerText = "WebXR Unavailable";
        instruction.innerText = "Open via HTTPS on a mobile device";
      }

      window.addEventListener('resize', onWindowResize, false);
    }

    async function startAR() {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.getElementById('ui-container') }
      });

      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);

      arBtn.style.display = 'none';
      resetBtn.style.display = 'inline-block';
      instruction.innerText = "Scan flat ground. Tap screen to drop Point A";

      session.addEventListener('select', onSelect);
      renderer.setAnimationLoop(render);
    }

    function onSelect() {
      if (!reticle.visible) return;

      if (points.length >= 2) {
        resetMeasurement();
      }

      // Extract current reticle position
      const pos = new THREE.Vector3();
      pos.setFromMatrixPosition(reticle.matrix);

      // Create a 3D Marker Dot
      const dotGeo = new THREE.SphereGeometry(0.015, 16, 16);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.copy(pos);
      scene.add(dot);
      points.push({ mesh: dot, coord: pos });

      if (points.length === 1) {
        instruction.innerText = "Point A set! Move to Point B and tap";
      } else if (points.length === 2) {
        drawLineAndMeasure(points[0].coord, points[1].coord);
        instruction.innerText = "Measurement complete!";
      }
    }

    function drawLineAndMeasure(p1, p2) {
      // 3D Connecting Line
      const material = new THREE.LineBasicMaterial({ color: 0x00e5ff, linewidth: 3 });
      const geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      measurementLine = new THREE.Line(geometry, material);
      scene.add(measurementLine);

      // Euclidean Distance Calculation
      const distMeters = p1.distanceTo(p2);
      const totalInches = distMeters * 39.3701;
      const feet = Math.floor(totalInches / 12);
      const inches = Math.round(totalInches % 12);

      distanceReadout.innerText = `${feet}' ${inches}"`;
      metricReadout.innerText = `${distMeters.toFixed(3)} m (${totalInches.toFixed(1)} in)`;
      readoutCard.style.display = 'block';
    }

    function resetMeasurement() {
      points.forEach(p => scene.remove(p.mesh));
      points = [];
      if (measurementLine) {
        scene.remove(measurementLine);
        measurementLine = null;
      }
      readoutCard.style.display = 'none';
      instruction.innerText = "Tap screen to drop Point A";
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((referenceSpace) => {
            session.requestHitTestSource({ space: referenceSpace }).then((source) => {
              hitTestSource = source;
            });
          });

          session.requestReferenceSpace('local').then((space) => {
            xrRefSpace = space;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(xrRefSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
