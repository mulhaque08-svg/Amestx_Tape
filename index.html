<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapeSnap Express - Simple Camera Measuring Tape</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="express-app">
    
    <!-- Top Site Bar -->
    <header class="express-header">
      <div class="site-input-group">
        <label for="siteNameInput"><i class="fa-solid fa-location-dot"></i> SITE:</label>
        <input type="text" id="siteNameInput" value="Site AX" placeholder="Site Name...">
      </div>
      
      <div class="header-right">
        <button id="btnVoiceToggle" class="btn-icon-toggle active" title="Voice Readout ON/OFF">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button id="btnUnitToggle" class="unit-pill" title="Toggle Unit">RFT (Feet)</button>
      </div>
    </header>

    <!-- LIVE CAMERA WINDOW (Apple Measure App Style) -->
    <section class="camera-window-container">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <canvas id="cameraCanvas"></canvas>
      
      <!-- Target Reticle Overlay -->
      <div class="camera-reticle">
        <div class="reticle-ring"></div>
        <div class="reticle-dot"></div>
      </div>
      
      <!-- Live Camera Overlay Badge -->
      <div id="cameraStatusBadge" class="camera-status-badge">
        <span class="badge-dot"></span>
        <span id="cameraStatusText">AIM AT POINT A</span>
      </div>
    </section>

    <!-- Main Measuring Stage -->
    <main class="express-main">
      
      <!-- Current Live Segment Display -->
      <div class="live-readout-card">
        <span class="readout-label" id="readoutLabel">POINT A ➔ POINT B</span>
        <div class="readout-number" id="readoutVal">0.0 <span class="readout-unit">RFT</span></div>
      </div>
      
      <!-- Giant 50m Orange Measuring Tape Reel Button -->
      <div class="giant-button-container">
        <button id="btnGiantMeasure" class="btn-giant-reel">
          <div class="reel-handle">
            <div class="reel-inner-circle">
              <i class="fa-solid fa-camera reel-icon"></i>
              <span id="giantBtnText" class="giant-btn-text">TAP POINT A</span>
            </div>
          </div>
        </button>
      </div>

      <!-- Quick Actions -->
      <div class="segment-quick-actions">
        <button id="btnResetCurrent" class="btn-sub-action">
          <i class="fa-solid fa-rotate-left"></i> Reset Point
        </button>
        <button id="btnClearAll" class="btn-sub-action btn-danger">
          <i class="fa-solid fa-trash"></i> Clear All
        </button>
      </div>

      <!-- Measurements Tally Ledger (Excel Notepad Preview) -->
      <div class="ledger-container">
        <div class="ledger-header">
          <h3><i class="fa-solid fa-list-ol"></i> Site Log (<span id="logCount">0</span>)</h3>
          <div class="ledger-total">TOTAL: <strong id="totalTallyVal">0.0 RFT</strong></div>
        </div>
        
        <div id="ledgerList" class="ledger-list">
          <div class="empty-ledger">
            <i class="fa-solid fa-clipboard-list"></i>
            <p>No measurements taken yet.</p>
            <span>Aim camera at Point A, tap orange button, then aim at Point B and tap again!</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Office Export Bar -->
    <footer class="express-footer">
      <button id="btnExportNotepad" class="btn-export btn-notepad">
        <i class="fa-solid fa-copy"></i>
        <span>Copy for Notepad / WhatsApp</span>
      </button>
      
      <button id="btnExportExcel" class="btn-export btn-excel">
        <i class="fa-solid fa-file-excel"></i>
        <span>Save Excel Sheet (.CSV)</span>
      </button>
    </footer>

  </div>

  <!-- App JavaScript Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
